@if (form!=null) {
  <form [formGroup]="form">
    <div class="form-group" [class.has-error]="!form.controls['current_password'].valid && !form.controls['current_password'].pristine">
      <label class="control-label" for="current_password">Current Password</label>
      <input class="form-control" id="current_password" type="password" [formControl]="form.controls['current_password'] | formControl">
    </div>
    <hr/>
    <div class="form-group" [class.has-error]="!form.controls['first_name'].valid">
      <label class="control-label" for="first-name">First Name</label>
      <input class="form-control" id="first-name" type="text" [formControl]="form.controls['first_name'] | formControl">
    </div>
    <div class="form-group" [class.has-error]="!form.controls['last_name'].valid">
      <label class="control-label" for="last-name">Last Name</label>
      <input class="form-control" id="last-name" type="text" [formControl]="form.controls['last_name'] | formControl">
    </div>
    <div class="form-group" [class.has-error]="!form.controls['email'].valid">
      <label class="control-label" for="email">E-mail</label>
      <input class="form-control" id="email" type="email" [formControl]="form.controls['email'] | formControl">
    </div>
    <div class="form-group" [class.has-error]="!passwords.controls['password'].valid">
      <label class="control-label" for="password">New Password </label>
      <input class="form-control" id="password" type="password" [formControl]="passwords.controls['password'] | formControl">
      <span class="help-block"><i>leave blank to keep password unchanged</i></span>
    </div>
    <div class="form-group" [class.has-error]="!form.controls['passwords'].valid">
      <label class="control-label" for="password_confirmation">Confirm New Password</label>
      <input class="form-control" id="password_confirmation" type="password" [formControl]="passwords.controls['password_confirmation'] | formControl">
      @if (!form.controls['passwords'].valid) {
        <span class="help-block danger">passwords must match</span>
      }
    </div>
    <button type="submit" (click)="onSubmit(form.value)" class="btn btn-primary " [disabled]="!form.valid">Save</button>
  </form>
}
